# Render Blueprint — NestJS API as a Docker web service.
# Frontend (apps/web) is deployed separately on Vercel.
services:
  - type: web
    name: sms-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    region: ohio # match Neon us-east-2 to minimise DB latency
    plan: free
    healthCheckPath: /api/health
    # Start command lives in the Dockerfile CMD (migrate deploy -> boot), so no
    # dockerCommand override is needed here (the field mangles shell quoting).
    envVars:
      - key: NODE_ENV
        value: production
      # Keep V8's heap under Render's 512MB free-instance ceiling (mirrors the
      # Dockerfile ENV; avoids OOM/137 on boot + migrate).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Set to the Vercel domain once the frontend is deployed.
      - key: CORS_ORIGIN
        sync: false
